{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Tables Overview" %}{% endblock %}

{% block content %}
<div class="tables-wrapper">
  <h2 class="page-title">{% trans "Tables" %}</h2>

  <div id="tables-grid"
       hx-get="{% url 'table:tables-grid-refresh' %}"
       hx-trigger="load, every 5s"
       hx-target="#tables-grid"
       hx-swap="innerHTML transition:true">
    {% include "table/partials/grid_partial.html" %}
  </div>
</div>

<style>
  .tables-wrapper {
    width: 100%;
    min-height: 100vh;
    background-color: #f9fafb;
    overflow-x: hidden;
  }

  .page-title {
    text-align: center;
    font-weight: 600;
    font-size: 1.2rem;
    color: #1c1c1c;
    margin: 0.4rem 0 0.6rem 0;
  }

  .tables-grid {
    width: 100%;
    height: calc(100vh - 100px);
  }
</style>
{% endblock %}
